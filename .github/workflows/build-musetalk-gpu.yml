name: Build MuseTalk GPU image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push MuseTalk GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: gpu
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nymphora2026/musetalk-1.5:0a89dec45a0192b824e3cf4daf96c239440c5ed8
            ghcr.io/nymphora2026/musetalk-1.5:v1.5
          provenance: false
